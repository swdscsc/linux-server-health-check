name: Shell checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - name: Check Bash syntax
        run: bash -n src/health_check.sh tests/test_health_check.sh
      - name: Run smoke tests
        run: bash tests/test_health_check.sh
      - name: Lint shell scripts
        run: shellcheck --severity=warning src/health_check.sh tests/test_health_check.sh
